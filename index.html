```html
<!-- Customer Queue -->

<div class="card">

    <h2>🍿 Customer Queue (FIFO)</h2>

    <form action="/enqueue" method="POST">

        <input
            type="text"
            name="customer"
            placeholder="Enter Customer Name"
            required
        >

        <button type="submit">
            Join Queue
        </button>

    </form>

    <!-- Book Ticket Button -->
    <a href="/dequeue">
        <button type="button">
            Book Ticket
        </button>
    </a>

    <h3>Waiting Customers</h3>

    <ul>
        {% if queue %}
            {% for customer in queue %}
                <li>{{ customer }}</li>
            {% endfor %}
        {% else %}
            <li>Queue Empty</li>
        {% endif %}
    </ul>

</div>
```
